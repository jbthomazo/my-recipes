site_name: Mes Recettes de Cuisine
theme:
  name: material
  custom_dir: overrides
  language: fr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  favicon: assets/images/nomega_logo_small.png
  icon:
    logo: material/silverware-fork-knife # Optionnel : une icône dans la barre de titre

nav:
  - Accueil: index.md
  - Plats: 
      - Poulet au curry: plats/poulet-curry.md
  - Desserts:
      - Fondant au chocolat: desserts/fondant.md
      - Scones: desserts/scones.md

extra:
  manifest: 'manifest.webmanifest'

hooks:
  - hooks/recettes.py

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
